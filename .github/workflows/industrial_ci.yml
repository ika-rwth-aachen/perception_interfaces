name: industrial_ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  industrial_ci:
    if: ${{ false }} # reenable once recursive perception/planning_interfaces dependency is merged/released: https://github.com/ika-rwth-aachen/rviz_2d_overlay_plugins/pull/2
    name: ROS ${{ matrix.ROS_DISTRO }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ROS_DISTRO: [humble, jazzy, kilted]
    steps:
      - uses: actions/checkout@v4
      - uses: ros-industrial/industrial_ci@master
        env:
          ROS_REPO: main
        with:
          config: ${{ toJSON(matrix) }}
